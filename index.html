<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FLG - 312 COLORED CARDS - FINAL LARGE BLUEPRINT</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;min-height:100dvh;background:#000;color:#fff;font-family:'JetBrains Mono',monospace;-webkit-text-size-adjust:100%;font-size:16px;overflow-x:hidden}
.orbitron{font-family:'Orbitron',monospace}
.top-bar{height:52px;background:#000;border-bottom:2px solid #ff1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.clock{font-weight:900;color:#ff1a1a;font-size:15px}
.reactor-hero{position:relative;width:100%;background:radial-gradient(ellipse at center,#1a0a0a 0%,#000 70%);display:flex;flex-direction:column;align-items:center;padding:12px 0 6px}
.reactor-img-wrap{position:relative;width:92vw;max-width:420px;aspect-ratio:1;margin:0 auto;cursor:pointer;border-radius:50%;overflow:hidden;box-shadow:0 0 90px rgba(255,26,26,.55)}
.reactor-img-wrap img{width:100%;height:100%;object-fit:contain}
.diag-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;width:100%;max-width:480px;margin:0 auto}
.diag-card{background:#0a0a0a;border:2px solid #ff1a1a;border-radius:18px;padding:16px;cursor:pointer}
.filters{display:flex;gap:8px;padding:12px;overflow-x:auto;position:sticky;top:52px;z-index:40;background:#000;border-bottom:1px solid #1a1a1a}
.pill{flex:0 0 auto;height:38px;padding:0 16px;border-radius:999px;border:1px solid #2a2a2a;background:#111;font-size:11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;font-weight:700}
.pill.active{background:#fff;color:#000}
.search-wrap{padding:12px;display:flex;gap:10px;position:sticky;top:52px;z-index:39;background:#000}
.search-wrap input{flex:1;height:48px;background:#111;border:1.5px solid #222;border-radius:14px;padding:0 14px;color:#fff;font-size:14px}
.search-wrap select{height:48px;background:#111;border:1.5px solid #222;border-radius:14px;padding:0 12px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{height:172px;border-radius:14px;border-left:4px solid;cursor:pointer;transition:.16s;display:flex;flex-direction:column;padding:14px;background:linear-gradient(135deg,var(--bg),var(--bg2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 4px 16px rgba(0,0,0,.6)}
.card:active{transform:scale(.96)}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.7),0 0 18px var(--color)}
.card-letter{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.15)}
.card-title{font-size:12.5px;font-weight:900;margin-top:10px;min-height:45px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-cat{font-size:9px;opacity:.65;margin-top:auto;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.launch-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:22px}
.launch-box{width:100%;max-width:440px;background:#0e0e0e;border:1.5px solid #222;border-radius:26px;padding:24px;text-align:center}
.progress{height:8px;background:#1a1a1a;border-radius:999px;overflow:hidden;margin-top:16px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--color),#fff);transition:width .12s}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#000;border-top:2px solid #ff1a1a;display:flex;z-index:60;padding:8px 10px;gap:8px}
.bn{flex:1;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid #1e1e1e;background:#111;font-weight:700}
.bn.active{background:#fff;color:#000;font-weight:900}.bn small{font-size:9px;opacity:.7}
.recent{display:flex;gap:10px;padding:10px 12px;overflow-x:auto}.recent-item{flex:0 0 auto;width:72px;height:72px;border-radius:14px;border:1.5px solid #222;display:flex;align-items:center;justify-content:center;font-size:9.5px;text-align:center;padding:6px;cursor:pointer;font-weight:800}
.toast-wrap{position:fixed;top:62px;right:10px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{background:#151515;border:1px solid #2a2a2a;border-radius:999px;padding:10px 16px;font-size:12px}
</style>
</head>

<div class="clock" id="clock">00:00:00</div>
<div style="font-size:10px;
