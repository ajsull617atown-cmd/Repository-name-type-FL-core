<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLG Reactor - Library 312</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace}
  body{background:#000;color:#fff;min-height:100vh;padding-bottom:90px}
  .header{padding:16px 16px 12px;display:flex;justify-content:space-between;align-items:center}
  .title{font-size:18px;font-weight:800;letter-spacing:1px}
  .toggles{display:flex;gap:8px}
  .toggle{padding:6px 16px;border-radius:16px;font-size:11px;font-weight:800}
  .toggle.grid{background:#fff;color:#000}
  .toggle.compact{background:#111;color:#888;border:1px solid #222}
  .search{margin:0 16px 12px;background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:12px 16px;display:flex;gap:10px;align-items:center}
  .search input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:11px;letter-spacing:1px}
  .grid-lib{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
  .card{background:#0a0a0a;border:1px solid #151515;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
  .card:active{transform:scale(0.97)}
  .card-top{height:6px;width:100%}
  .card-body{padding:12px 12px 0;display:flex;gap:10px}
  .card-icon{width:64px;height:64px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .badge{border:1px solid var(--glow);padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;color:var(--glow);background:#1a1a1a;display:inline-block}
  .fps{color:#666;font-size:10px;margin-top:4px}
  .card-title{padding:10px 12px 0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-pkg{padding:2px 12px 0;font-size:9px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-foot{padding:10px;display:flex;justify-content:space-between;align-items:center}
  .open-btn{background:#fff;color:#000;padding:6px 16px;border-radius:16px 0 16px 0;font-size:11px;font-weight:800}
  .arrow{width:28px;height:28px;border:1px solid var(--glow);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--glow);font-size:12px}
  .card-glow{height:2px;opacity:0.6;margin:0 12px}
  .hint{text-align:center;color:#666;font-size:9px;letter-spacing:1px;margin-top:12px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#000;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid #111}
  .nav-btn{background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:10px;text-align:center}
  .nav-btn.active{background:#fff}
  .nav-btn.active div{color:#000!important;font-weight:800}
  .nav-t{font-size:11px;color:#888}
  .nav-s{font-size:8px;color:#555;margin-top:2px}
</style>
</head>
<body>
<div class="header"><div class="title">LIBRARY • 312</div><div class="toggles"><div class="toggle grid">GRID</div><div class="toggle compact">COMPACT</div></div></div>
<div class="search"><span style="color:#555">⌕</span><input id="search" placeholder="SEARCH BUILDS, STATUS, FPS..." oninput="filterGames()"></div>
<div class="grid-lib" id="grid"></div>
<div class="hint">TAP CARD TO TRANSFORM • OPEN TO LAUNCH</div>
<div class="nav"><div class="nav-btn" onclick="location.href='index.html'"><div class="nav-t">REACTOR</div><div class="nav-s">CORE-01</div></div><div class="nav-btn active"><div class="nav-t">LIBRARY</div><div class="nav-s">208 • 312</div></div><div class="nav-btn"><div class="nav-t">BUILDS</div><div class="nav-s">6 SKINS</div></div></div>
<script>
const games=[
 {title:"PALWORLD",pkg:"com.factoryline.palworld",icon:"🎮",color:"#a855f7",status:"100%",fps:120},
 {title:"ELDEN RING",pkg:"com.factoryline.eldenring",icon:"👾",color:"#facc15",status:"PLAYED",fps:97},
 {title:"CYBERPUNK 2077",pkg:"com.factoryline.cyberpunk",icon:"🚀",color:"#06b6d4",status:"NEW",fps:134},
 {title:"FORTNITE",pkg:"com.factoryline.fortnite",icon:"🏹",color:"#f97316",status:"SYNC",fps:231},
 {title:"FORZA HORIZON 5",pkg:"Xbox/Forza5",icon:"🏁",color:"#f97316",status:"INSTALLED",fps:144},
 {title:"WITCHER 3",pkg:"GOG/Witcher3",icon:"🐺",color:"#444",status:"INSTALLED",fps:120},
 {title:"DIABLO IV",pkg:"Bnet/Diablo4",icon:"😈",color:"#991b1b",status:"INSTALLED",fps:160},
 {title:"ASSASSINS CREED",pkg:"Ubisoft/AC",icon:"🗡️",color:"#1e3a8a",status:"INSTALLED",fps:90},
 {title:"FIFA 25",pkg:"EA/FC25",icon:"⚽",color:"#00ff88",status:"INSTALLED",fps:144},
 {title:"NEW WORLD",pkg:"Amazon/NewWorld",icon:"🌲",color:"#f59e0b",status:"INSTALLED",fps:110},
];
function render(list){
 document.getElementById('grid').innerHTML = list.map(g=>`
 <div class="card" style="--glow:${g.color}" onclick="transform('${g.title}')">
  <div class="card-top" style="background:${g.color}"></div>
  <div class="card-body">
   <div class="card-icon">${g.icon}</div>
   <div><div class="badge" style="border-color:${g.color};color:${g.color}">${g.status}</div><div class="fps">${g.fps} FPS</div></div>
  </div>
  <div class="card-title">${g.title}</div>
  <div class="card-pkg">${g.pkg}</div>
  <div class="card-foot"><div class="open-btn">OPEN →</div><div class="arrow" style="border-color:${g.color};color:${g.color}">↗</div></div>
  <div class="card-glow" style="background:${g.color}"></div>
 </div>`).join('');
}
function filterGames(){const q=document.getElementById('search').value.toLowerCase();render(games.filter(g=>g.title.toLowerCase().includes(q)||g.status.toLowerCase().includes(q)))}
function transform(t){alert(t+" → TRANSFORM CORE // Reactor will turn "+t+" color "+t+"-01");localStorage.setItem('activeBuild',t);location.href='index.html';}
render(games);
</script>
</body>
</html>
