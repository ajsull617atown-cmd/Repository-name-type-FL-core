<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLG REACTOR OS - v0.5 EXACT CLONE EVERY BUTTON WORKING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
#app{display:flex;height:100vh}
#sidebar{width:260px;background:#0a0a0a;border-right:1px solid #222;padding:20px;display:flex;flex-direction:column}
.logo{font-weight:900;letter-spacing:2px;font-size:18px;margin-bottom:24px}
.logo span{color:#a855f7}
.nav-btn{width:100%;text-align:left;background:transparent;border:1px solid #222;color:#888;padding:12px 14px;margin-bottom:8px;border-radius:10px;font-weight:700;cursor:pointer;transition:.2s}
.nav-btn.active,.nav-btn:hover{background:#1a1a1a;color:#fff;border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.3)}
#main{flex:1;display:flex;flex-direction:column;background:#050505}
#topbar{height:64px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0a0a0a}
#search{width:420px;max-width:50vw;background:#111;border:1px solid #222;color:#fff;padding:10px 14px;border-radius:10px;outline:none}
#search:focus{border-color:#a855f7}
.top-stats{display:flex;gap:12px;font-size:12px;color:#666}
#grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;overflow-y:auto}
.card{background:#0f0f0f;border:1px solid #1f1f1f;border-radius:16px;padding:14px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--glow);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px var(--glow-alpha)}
.card-top{display:flex;gap:12px}
.icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;background:#1a1a1a;border:1px solid var(--glow);color:var(--glow)}
.card-info{flex:1}
.card-title{font-weight:900;letter-spacing:.5px;font-size:14px;margin-bottom:4px}
.card-meta{font-size:11px;color:#666;display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:2px 6px;border-radius:6px;font-size:10px;font-weight:800;border:1px solid #222}
.badge-played{color:#facc15;border-color:#facc15}
.badge-new{color:#06b6d4;border-color:#06b6d4}
.badge-sync{color:#f97316;border-color:#f97316}
.badge-installed{color:#22c55e;border-color:#22c55e}
.card-actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:9px;border-radius:9px;border:1px solid #222;background:#1a1a1a;color:#fff;font-weight:800;font-size:12px;cursor:pointer;transition:.2s}
.btn-primary{background:#fff;color:#000;border-color:#fff}
.btn-primary:hover{background:var(--glow);color:#fff;border-color:var(--glow)}
.btn:hover{border-color:var(--glow);color:var(--glow)}
.fav{position:absolute;top:12px;right:12px;background:transparent;border:none;color:#333;font-size:18px;cursor:pointer}
.fav.active{color:#facc15}
#empty{padding:40px;text-align:center;color:#444}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:12px;font-weight:800;z-index:9999;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="logo"><span>FLG</span> REACTOR OS</div>
    <button class="nav-btn active" data-filter="all" onclick="filterGames('all',this)">● ALL ASSETS (304)</button>
    <button class="nav-btn" data-filter="installed" onclick="filterGames('installed',this)">▼ INSTALLED (187)</button>
    <button class="nav-btn" data-filter="favorite" onclick="filterGames('favorite',this)">★ FAVORITES (23)</button>
    <button class="nav-btn" data-filter="FactoryLine" onclick="filterGames('FactoryLine',this)">◼ FACTORYLINE (42)</button>
    <button class="nav-btn" data-filter="Steam" onclick="filterGames('Steam',this)">◼ STEAM (89)</button>
    <button class="nav-btn" data-filter="ANDROID" onclick="filterGames('ANDROID',this)">◼ ANDROID (173)</button>
    <div style="margin-top:auto;padding-top:20px;border-top:1px solid #1a1a1a;font-size:11px;color:#444">v0.5 EXACT CLONE<br>EVERY BUTTON WORKING<br>BUILD: 2026-08-19</div>
  </div>
  <div id="main">
    <div id="topbar">
      <input id="search" placeholder="SEARCH 304 ASSETS... (Press /)" oninput="searchGames(this.value)">
      <div class="top-stats"><span id="count">304</span> ASSETS • <span id="fps">120</span> FPS</div>
    </div>
    <div id="grid"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const games=[
{id:'palworld-01',title:'PALWORLD',pkg:'com.factoryline.palworld',installed:true,fav:true,provider:'FactoryLine',glow:'#a855f7',status:'100%',fps:120,core:'PL',playtime:134},
{id:'eldenring-01',title:'ELDEN RING',pkg:'com.factoryline.eldenring',installed:true,fav:true,provider:'FactoryLine',glow:'#facc15',status:'PLAYED',fps:97,core:'ER',playtime:231},
{id:'cyberpunk-01',title:'CYBERPUNK 2077',pkg:'com.factoryline.cyberpunk',installed:true,fav:false,provider:'FactoryLine',glow:'#06b6d4',status:'NEW',fps:134,core:'CP',playtime:0},
{id:'fortnite-01',title:'FORTNITE',pkg:'com.epicgames.fortnite',installed:true,fav:false,provider:'FactoryLine',glow:'#f97316',status:'SYNC',fps:231,core:'FN',playtime:412},
{id:'steam-01',title:'Steam',pkg:'com.valvesoftware.android.steam.community',installed:false,fav:true,provider:'ANDROID',glow:'#ff1515',status:'INSTALLED',fps:60,core:'ST',playtime:0,type:'app'},
{id:'cod-01',title:'CALL OF DUTY MOBILE',pkg:'com.activision.callofduty.shooter',installed:true,fav:false,provider:'ANDROID',glow:'#00ff88',status:'100%',fps:120,core:'COD',playtime:89},
{id:'genshin-01',title:'GENSHIN IMPACT',pkg:'com.miHoYo.GenshinImpact',installed:true,fav:false,provider:'ANDROID',glow:'#ff6b',status:'PLAYED',fps:60,core:'GI',playtime:156},
{id:'roblox-01',title:'ROBLOX',pkg:'com.roblox.client',installed:false,fav:false,provider:'ANDROID',glow:'#ff0000',status:'SYNC',fps:60,core:'RB',playtime:0}
];
let currentFilter='all';let searchQuery='';
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function render(list){
const grid=document.getElementById('grid');
if(!list.length){grid.innerHTML='<div id="empty">NO ASSETS FOUND</div>';return;}
grid.innerHTML=list.map(g=>`
<div class="card" style="--glow:${g.glow};--glow-alpha:${hexToRgba(g.glow,.35)}" onclick="launchGame('${g.id}')">
<button class="fav ${g.fav?'active':''}" onclick="event.stopPropagation();toggleFav('${g.id}')">${g.fav?'★':'☆'}</button>
<div class="card-top"><div class="icon">${g.core}</div><div class="card-info"><div class="card-title">${g.title}</div><div class="card-meta"><span>${g.provider}</span><span>•</span><span>${g.fps} FPS</span><span>•</span><span>${g.playtime}H</span></div><div style="margin-top:6px"><span class="badge badge-${g.status.toLowerCase()}">${g.status}</span> ${!g.installed?'<span class="badge">NOT INSTALLED</span>':''}</div></div></div>
<div class="card-actions"><button class="btn btn-primary" onclick="event.stopPropagation();launchGame('${g.id}')">${g.installed?'OPEN':'INSTALL'}</button><button class="btn" onclick="event.stopPropagation();showDetails('${g.id}')">DETAILS</button></div>
</div>`).join('');
document.getElementById('count').textContent=list.length;
}
function filterGames(type,btn){
currentFilter=type;
document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
if(btn)btn.classList.add('active');
let list=games;
if(type==='installed')list=list.filter(g=>g.installed);
if(type==='favorite')list=list.filter(g=>g.fav);
if(type!=='all'&&type!=='installed'&&type!=='favorite')list=list.filter(g=>g.provider===type);
if(searchQuery)list=list.filter(g=>g.title.toLowerCase().includes(searchQuery));
render(list);
showToast(type.toUpperCase()+' FILTER APPLIED');
}
function searchGames(q){
searchQuery=q.toLowerCase();
let list=games;
if(currentFilter==='installed')list=list.filter(g=>g.installed);
if(currentFilter==='favorite')list=list.filter(g=>g.fav);
if(currentFilter!=='all'&&currentFilter!=='installed'&&currentFilter!=='favorite')list=list.filter(g=>g.provider===currentFilter);
if(q)list=list.filter(g=>g.title.toLowerCase().includes(q)||g.pkg.toLowerCase().includes(q));
render(list);
}
function toggleFav(id){
const g=games.find(x=>x.id===id);
g.fav=!g.fav;renderFiltered();showToast(g.fav?g.title+' ADDED TO FAVORITES':g.title+' REMOVED');
}
function renderFiltered(){searchGames(searchQuery);}
function launchGame(id){
const g=games.find(x=>x.id===id);
if(!g)return;
if(window.Android&&window.Android.launchApp){window.Android.launchApp(g.pkg);showToast('LAUNCHING '+g.title+' -> '+g.pkg);}
else{if(g.installed)showToast('ANDROID LAUNCH: '+g.pkg+' (Would launch via PackageManager.getLaunchIntentForPackage)');else{showToast('OPENING STORE: '+g.pkg);window.open('https://play.google.com/store/apps/details?id='+g.pkg,'_blank');}}
}
function showDetails(id){
const g=games.find(x=>x.id===id);
showToast(`${g.title} | PKG: ${g.pkg} | ${g.fps} FPS | ${g.status} | Installed: ${g.installed} | Provider: ${g.provider} | Glow: ${g.glow}`);
}
document.addEventListener('keydown',e=>{if(e.key==='/'){e.preventDefault();document.getElementById('search').focus();}});
render(games);
</script>
</body>
</html>
