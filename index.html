<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0}body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px 500px at 50% 0%, rgba(255,21,21,0.2), transparent)}

.tabs{position:fixed;bottom:16px;left:12px;right:12px;display:flex;gap:8px;background:#0c0c0ce6;border:1px solid #1e1e1e;border-radius:24px;padding:6px}
.tab{flex:1;padding:18px;border-radius:18px;background:transparent;border:none;color:#666;font-weight:800} .tab.on{background:#ff1515;color:#000;box-shadow:0 8px 32px #ff151588}
</style></head><body>
